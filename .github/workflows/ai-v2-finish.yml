name: AI V2 validated source recovery
on:
  push:
    branches: [feature/ai-provider-center-v2]
    paths: [.github/workflows/ai-v2-finish.yml]
permissions:
  contents: read
concurrency:
  group: ai-v2-validated-source-recovery
  cancel-in-progress: true
jobs:
  recover:
    if: github.repository == 'mittywave/zhiti-local-question-bank' && github.ref == 'refs/heads/feature/ai-provider-center-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_TREE: aba96a571eaf48b4129ef3de3156a3f07843a58f
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recover only the checksum-verified source from completed acceptance steps
        run: |
          gh api repos/mittywave/zhiti-local-question-bank/actions/jobs/108572628249 > /tmp/acceptance-job.json
          python3 - <<'PY'
          import json
          job=json.load(open('/tmp/acceptance-job.json'))
          assert job['run_id']==36302487928
          required=['Full regression with first-attempt evidence retained','Independent homework stability runs','Actual Worker D1 Chromium WebKit and browser Word downloads','Render every page of both browser-exported Word samples']
          for name in required:
              assert next(s for s in job['steps'] if s['name']==name)['conclusion']=='success',name
          PY
          gh run download 36302487928 --repo mittywave/zhiti-local-question-bank --name ai-v2-finish-evidence --dir /tmp/acceptance
          mkdir -p /tmp/validated-source
          tar -xzf /tmp/acceptance/validated-source.tar.gz -C /tmp/validated-source
          git -C /tmp/validated-source init -q
          git -C /tmp/validated-source add -A
          test "$(git -C /tmp/validated-source write-tree)" = "$EXPECTED_TREE"
      - name: Store staged Git bytes, never build-mutated working files, without updating refs
        run: |
          mkdir -p recovery-evidence
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          root='/tmp/validated-source'
          def git(*args):
              return subprocess.check_output(['git','-C',root,*args])
          def post(path,body):
              req=urllib.request.Request(f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/git/{path}',data=json.dumps(body).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as response:return json.load(response)
          base=json.loads(subprocess.check_output(['gh','api','repos/mittywave/zhiti-local-question-bank/git/trees/bf150902e50d7693f7bff69179ffa331a1fd5d11?recursive=1']))
          existing={e['sha'] for e in base['tree'] if e['type']=='blob'}
          entries=[]
          for record in git('ls-files','--stage','-z').decode().split('\0'):
              if not record:continue
              meta,path=record.split('\t',1)
              mode,sha,stage=meta.split()
              assert stage=='0'
              if sha not in existing:
                  raw=git('cat-file','blob',sha)
                  assert hashlib.sha1(f'blob {len(raw)}\0'.encode()+raw).hexdigest()==sha
                  result=post('blobs',{'encoding':'base64','content':base64.b64encode(raw).decode()})
                  assert result['sha']==sha,(path,sha,result['sha'])
                  print('Stored',path,sha)
              entries.append({'path':path,'mode':mode,'type':'blob','sha':sha})
          tree=post('trees',{'tree':entries})['sha']
          assert tree==os.environ['EXPECTED_TREE'],(tree,os.environ['EXPECTED_TREE'])
          report={'tree':tree,'acceptanceRun':36302487928,'recoveryRun':os.environ['GITHUB_RUN_ID'],'parent':os.environ['GITHUB_SHA'],'refUpdated':False,'productionTouched':False}
          pathlib.Path('recovery-evidence/source-tree.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-v2-recovered-source
          path: recovery-evidence
          retention-days: 7
