name: AI Provider V2 validation
on:
  push:
    branches: [feature/ai-provider-center-v2]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ai-provider-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive exact public source for review
        run: git archive HEAD | gzip > /tmp/ai-v2-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ai-v2-source
          path: /tmp/ai-v2-source.tar.gz
          retention-days: 7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:studio
      - run: npm test
      - run: npm run benchmark:studio
