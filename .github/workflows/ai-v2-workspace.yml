name: AI V2 isolated workspace
on:
  push:
    branches: [feature/ai-provider-center-v2]
    paths: [.github/workflows/ai-v2-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    if: github.repository == 'mittywave/zhiti-local-question-bank'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Package dependencies without user credentials or database state
        run: |
          tar -czf /tmp/ai-v2-node-modules.tar.gz node_modules
          sha256sum package-lock.json /tmp/ai-v2-node-modules.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ai-v2-node-modules
          path: /tmp/ai-v2-node-modules.tar.gz
          retention-days: 1
